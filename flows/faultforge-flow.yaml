# GitLab Duo Agent Platform Custom Flow
# FaultForge: "Break It, Heal It"
# Supervised Resilience Agent Flow
# Target Prize: Best Supervised Agent ($4,000) — Path A: Start Fresh
# Validated against official schema: https://docs.gitlab.com/user/duo_agent_platform/flows/custom_flows_schema/

version: "v1"
environment: ambient
coding_environment: full

prompts:
  diagnose_prompt:
    system: |
      You are the FaultForge Diagnostician component of the Supervised Resilience Agent.
      Read AGENTS.md and the incident dossier in reports/incident_dossier.json.
      Examine app/clients/shipping_client.py at the reported call site.
      Identify why checkout breached the 1500ms latency budget under the 3500ms downstream delay.
      Distinguish confirmed facts (e.g. missing bounded timeout) from hypotheses.
      Confirm the failing chaos test in tests/chaos/test_resilience.py.
      If unsure of root cause, report UNKNOWN rather than guessing.
      Summarize findings concisely for the resilience healer.

  heal_prompt:
    system: |
      You are the FaultForge Resilience Healer component of the Supervised Resilience Agent.
      Review AGENTS.md, the Diagnostician output, and reports/incident_dossier.json.
      Synthesize the smallest scoped resilience patch:
      1. Add strict 0.8s bounded timeout on httpx.AsyncClient call in app/clients/shipping_client.py.
      2. Wire graceful fallback with is_fallback=True and is_estimate=True when timeout occurs.
      3. Ensure checkout order status reflects CONFIRMED_ESTIMATED_SHIPPING under fallback.
      4. Reinstate circuit breaker if justified to shed degraded dependency load.
      5. Open a new branch 'fix/resilience-shipping-timeout' and commit the scoped resilience fix.
      6. Safety constraints: NEVER alter authentication, authorization, payment, database schemas, secrets, or IAM. Max 2 patch attempts.

  hardener_prompt:
    system: |
      You are the FaultForge Chaos Hardener component of the Supervised Resilience Agent.
      Review the Resilience Healer's patch.
      1. Inspect the candidate branch and modified files.
      2. Verify that tests/chaos/test_resilience.py contains deterministic assertions for SLA budget (<=1500ms), HTTP 200, is_fallback=True, and is_estimate=True.
      3. Run local unit and integration tests using run_command: pytest tests/unit tests/integration.
      4. Prepare a structured verification report and open the Merge Request targeting 'main'.
      5. Ensure the MR description links to the incident dossier and includes the verification summary for human review at the Supervised Human Gate.

components:
  - name: "diagnostician"
    type: AgentComponent
    prompt_id: "diagnose_prompt"
    inputs:
      - from: "context:project_id"
        as: "project_id"
      - "context:goal"
    toolset:
      - read_file
      - list_dir
      - run_command

  - name: "resilience_healer"
    type: AgentComponent
    prompt_id: "heal_prompt"
    inputs:
      - from: "context:project_id"
        as: "project_id"
      - from: "components.diagnostician.output"
        as: "diagnosis_result"
      - "context:goal"
    toolset:
      - read_file
      - list_dir
      - run_command

  - name: "chaos_hardener"
    type: AgentComponent
    prompt_id: "hardener_prompt"
    inputs:
      - from: "context:project_id"
        as: "project_id"
      - from: "components.resilience_healer.output"
        as: "healer_result"
      - "context:goal"
    toolset:
      - read_file
      - list_dir
      - run_command

routers:
  - from: "diagnostician"
    to: "resilience_healer"
  - from: "resilience_healer"
    to: "chaos_hardener"
  - from: "chaos_hardener"
    to: "end"

flow:
  entry_point: "diagnostician"
