# GitLab Duo Agent Platform Custom Flow
# FaultForge: "Break It, Heal It"
# Supervised Resilience Agent Flow
# Target Prize: Best Supervised Agent ($4,000) — Path A: Start Fresh
# Validated against official schema: https://docs.gitlab.com/user/duo_agent_platform/flows/custom_flows_schema/
# Supported Triggers (Configured in GitLab UI under Automate -> Flows -> Trigger conditions):
#   - Mention: @ai-faultforge-flow <remediation request> in issue / MR comments
#   - Assignment: Assign the flow service account directly to incident issues
#   - API: Programmatic invocation via POST /ai/duo_workflows/

version: "v1"
environment: ambient
coding_environment: full

prompts:
  diagnose_prompt:
    system: |
      You are the FaultForge Diagnostician component of the Supervised Resilience Agent.
      Read AGENTS.md and the incident dossier in reports/incident_dossier.json.
      Examine app/clients/shipping_client.py at the reported call site.
      Identify why checkout breached the 1500ms latency budget under the 3500ms downstream delay.
      Distinguish confirmed facts (e.g. missing bounded timeout) from hypotheses.
      Confirm the failing chaos test in tests/chaos/test_resilience.py.
      If unsure of root cause, report UNKNOWN rather than guessing.
      Summarize findings concisely for the resilience healer.
    user: |
      Project ID: {{ project_id }}
      Goal: {{ goal }}

  heal_prompt:
    system: |
      You are the FaultForge Resilience Healer component of the Supervised Resilience Agent.
      Review AGENTS.md, the Diagnostician output, and reports/incident_dossier.json.
      Synthesize the smallest scoped resilience patch:
      1. Add strict 0.8s bounded timeout on httpx.AsyncClient call in app/clients/shipping_client.py.
      2. Wire graceful fallback with is_fallback=True and is_estimate=True when timeout occurs using policy in app/resilience/policy.py.
      3. Ensure checkout order status reflects CONFIRMED_ESTIMATED_SHIPPING under fallback.
      4. Reinstate circuit breaker in app/resilience/policy.py to shed degraded dependency load.
      5. Create a candidate branch 'fix/resilience-shipping-timeout' targeting app/clients/ and app/resilience/ using create_branch and create_commit.
      6. Safety constraints: NEVER alter authentication, authorization, payment, database schemas, secrets, IAM, .gitlab-ci.yml, or flows/. Max 2 patch attempts.
    user: |
      Project ID: {{ project_id }}
      Goal: {{ goal }}
      Diagnosis: {{ diagnosis_result }}

  hardener_prompt:
    system: |
      You are the FaultForge Chaos Hardener component of the Supervised Resilience Agent.
      Review the Resilience Healer's patch.
      1. Inspect the candidate branch and modified files using read_file and list_dir.
      2. Verify that tests/chaos/test_resilience.py contains deterministic assertions for SLA budget (<=1500ms), HTTP 200, is_fallback=True, and is_estimate=True.
      3. Run local unit and integration tests using run_command: pytest tests/unit tests/integration.
      4. Open a Merge Request targeting 'main' from branch 'fix/resilience-shipping-timeout' using create_merge_request.
      5. Mandatory governance constraints:
         - Post a summary note on the incident issue with the MR link using create_issue_note.
         - The MR description must link the incident dossier (reports/incident_dossier.json) and provide the exact Toxiproxy replay command: python scripts/evaluate_replay.py.
         - Ensure the candidate branch touches only app/clients/, app/resilience/, and tests/chaos/.
    user: |
      Project ID: {{ project_id }}
      Goal: {{ goal }}
      Healer Patch: {{ healer_result }}

components:
  - name: "diagnostician"
    type: AgentComponent
    prompt_id: "diagnose_prompt"
    inputs:
      - from: "context:project_id"
        as: "project_id"
      - from: "context:goal"
        as: "goal"
    toolset:
      - get_issue
      - read_file
      - list_dir
      - find_files
      - run_command

  - name: "resilience_healer"
    type: AgentComponent
    prompt_id: "heal_prompt"
    inputs:
      - from: "context:project_id"
        as: "project_id"
      - from: "context:goal"
        as: "goal"
      - from: "components.diagnostician.output"
        as: "diagnosis_result"
    toolset:
      - get_issue
      - read_file
      - list_dir
      - edit_file
      - write_file
      - run_command
      - create_branch
      - create_commit

  - name: "chaos_hardener"
    type: AgentComponent
    prompt_id: "hardener_prompt"
    inputs:
      - from: "context:project_id"
        as: "project_id"
      - from: "context:goal"
        as: "goal"
      - from: "components.resilience_healer.output"
        as: "healer_result"
    toolset:
      - get_issue
      - get_merge_request
      - create_merge_request
      - create_issue_note
      - create_merge_request_note
      - read_file
      - list_dir
      - run_command

routers:
  - from: "diagnostician"
    to: "resilience_healer"
  - from: "resilience_healer"
    to: "chaos_hardener"
  - from: "chaos_hardener"
    to: "end"

flow:
  entry_point: "diagnostician"
