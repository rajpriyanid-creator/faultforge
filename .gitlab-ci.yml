# FaultForge GitLab CI/CD Pipeline
# Complete 9 Lifecycle Stages: plan, create, configure, verify, secure, package, release, monitor, govern
# Verified against GitLab Transcend 2026 specification

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

stages:
  - plan
  - create
  - configure
  - verify
  - secure
  - package
  - release
  - monitor
  - govern

secret_detection:
  stage: secure
  allow_failure: false


variables:
  GIT_DEPTH: 0
  PYTHON_VERSION: "3.12"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  SERVICE_NAME: "faultforge-checkout"
  GCP_REGION: "us-central1"
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"

cache:
  paths:
    - .cache/pip
    - venv/

# -------------------------------------------------------------
# 1. PLAN STAGE: Incident Work Item Creation & Tracking
# -------------------------------------------------------------
plan:incident_tracking:
  stage: plan
  image: python:3.12-slim
  script:
    - pip install -r requirements.txt
    - python scripts/plan_incident.py
    - python scripts/evidence_ledger.py --stage plan --job plan:incident_tracking --status SUCCESS --artifacts reports/issue.json
  artifacts:
    name: "incident-plan-$CI_COMMIT_SHA"
    expire_in: 30 days
    paths:
      - reports/issue.json
      - reports/stage_ledger.json
      - reports/stage_ledger_*.json

# -------------------------------------------------------------
# 2. CREATE STAGE: Duo Remediation & Branch/MR Synthesis
# -------------------------------------------------------------
create:duo_remediation_mr:
  stage: create
  image: python:3.12-slim
  dependencies:
    - plan:incident_tracking
  script:
    - apt-get update -qq && apt-get install -y -qq git
    - pip install -r requirements.txt
    - python scripts/start_toxiproxy.py
    - python -m uvicorn stub.mock_shipping_api:app --host 127.0.0.1 --port 8081 &
    - python -m uvicorn app.main:app --host 127.0.0.1 --port 8090 &
    - sleep 2
    - python scripts/run_fault.py --label baseline --iterations 5 --expect-fail --output reports/fault_run_baseline.json
    - python scripts/collect_evidence.py
    - python scripts/diagnose_and_bisect.py
    - python scripts/trigger_duo_flow.py
    - python scripts/record_duo_evidence.py
    - python scripts/evidence_ledger.py --stage create --job create:duo_remediation_mr --status SUCCESS --artifacts reports/fault_run_baseline.json reports/incident_dossier.json reports/diagnosis_report.json reports/duo_run.json reports/duo_evidence.json
  artifacts:
    name: "remediation-mr-$CI_COMMIT_SHA"
    expire_in: 30 days
    paths:
      - reports/fault_run_baseline.json
      - reports/incident_dossier.json
      - reports/diagnosis_report.json
      - reports/duo_run.json
      - reports/duo_evidence.json
      - reports/stage_ledger.json
      - reports/stage_ledger_*.json

# -------------------------------------------------------------
# 3. CONFIGURE STAGE: Toxiproxy Setup & Chaos Network Wiring
# -------------------------------------------------------------
configure:chaos_topology:
  stage: configure
  image: python:3.12-slim
  services:
    - name: ghcr.io/shopify/toxiproxy:2.9.0
      alias: toxiproxy
  variables:
    TOXIPROXY_URL: "http://toxiproxy:8474"
  dependencies:
    - create:duo_remediation_mr
  script:
    - pip install -r requirements.txt
    - python scripts/start_toxiproxy.py
    - python scripts/configure_chaos.py
    - python scripts/evidence_ledger.py --stage configure --job configure:chaos_topology --status SUCCESS --artifacts reports/fault_config.json
  artifacts:
    expire_in: 30 days
    paths:
      - reports/fault_config.json
      - reports/stage_ledger.json
      - reports/stage_ledger_*.json

# -------------------------------------------------------------
# 4. VERIFY STAGE: Unit, Integration & Exact-Fault Replay Verification
# -------------------------------------------------------------
verify:unit_and_integration:
  stage: verify
  image: python:3.12-slim
  script:
    - pip install -r requirements.txt
    - pytest tests/unit tests/integration tests/test_*.py -v --junitxml=reports/junit_tests.xml
  artifacts:
    expire_in: 30 days
    reports:
      junit: reports/junit_tests.xml

verify:exact_fault_replay_proof:
  stage: verify
  image: python:3.12-slim
  services:
    - name: ghcr.io/shopify/toxiproxy:2.9.0
      alias: toxiproxy
  variables:
    TOXIPROXY_URL: "http://toxiproxy:8474"
    SHIPPING_SERVICE_URL: "http://127.0.0.1:8082"
  dependencies:
    - create:duo_remediation_mr
    - configure:chaos_topology
  script:
    - apt-get update -qq && apt-get install -y -qq git
    - pip install -r requirements.txt
    - python scripts/start_toxiproxy.py
    - |
      if [ -f reports/duo_evidence.json ] && python -c "import json; d=json.load(open('reports/duo_evidence.json')); exit(0 if d.get('found') and d.get('source_branch') else 1)"; then
        CANDIDATE_BRANCH=$(python -c "import json; print(json.load(open('reports/duo_evidence.json'))['source_branch'])")
        echo "[+] Testing Duo-authored candidate branch: $CANDIDATE_BRANCH"
        git fetch origin "$CANDIDATE_BRANCH"
        git checkout "origin/$CANDIDATE_BRANCH" -- app/clients/shipping_client.py
        FIX_SHA=$(git rev-parse "origin/$CANDIDATE_BRANCH")
        CANDIDATE_SRC="duo-authored-mr ($CANDIDATE_BRANCH)"
      else
        echo "[!] No Duo-authored MR branch detected; falling back to reference-fix"
        git fetch origin reference-fix
        git checkout origin/reference-fix -- app/clients/shipping_client.py
        FIX_SHA=$(git rev-parse origin/reference-fix || git rev-parse reference-fix)
        CANDIDATE_SRC="reference-fix (not Duo-authored)"
      fi
    - python -m uvicorn stub.mock_shipping_api:app --host 127.0.0.1 --port 8081 &
    - python -m uvicorn app.main:app --host 127.0.0.1 --port 8090 &
    - sleep 3
    - python scripts/run_fault.py --label candidate --git-sha $FIX_SHA --iterations 10 --output reports/fault_run_hardened.json
    - python scripts/evaluate_replay.py --baseline reports/fault_run_baseline.json --candidate reports/fault_run_hardened.json --output reports/replay_evaluation.json --candidate-source "$CANDIDATE_SRC"
    - python scripts/evidence_ledger.py --stage verify --job verify:exact_fault_replay_proof --status SUCCESS --artifacts reports/fault_run_hardened.json reports/replay_evaluation.json
  artifacts:
    name: "chaos-replay-evidence-$CI_COMMIT_SHA"
    expire_in: 30 days
    paths:
      - reports/fault_run_baseline.json
      - reports/fault_run_hardened.json
      - reports/replay_evaluation.json
      - reports/stage_ledger.json
      - reports/stage_ledger_*.json

# -------------------------------------------------------------
# 5. SECURE STAGE: Static Analysis & Secret Detection
# -------------------------------------------------------------
secure:sast_and_secret_scan:
  stage: secure
  image: python:3.12-slim
  dependencies:
    - verify:exact_fault_replay_proof
  script:
    - pip install -r requirements.txt
    - bandit -r app/ -ll -f json -o reports/bandit_security_report.json
    - python scripts/evidence_ledger.py --stage secure --job secure:sast_and_secret_scan --status SUCCESS --artifacts reports/bandit_security_report.json
  artifacts:
    expire_in: 30 days
    paths:
      - reports/bandit_security_report.json
      - reports/stage_ledger.json
      - reports/stage_ledger_*.json

# -------------------------------------------------------------
# 6. PACKAGE STAGE: Multi-Stage Container Build & Registry Push
# -------------------------------------------------------------
package:container_build:
  stage: package
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  dependencies:
    - secure:sast_and_secret_scan
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t $DOCKER_IMAGE .
    - |
      if [ -n "$CI_REGISTRY_USER" ] && [ -n "$CI_REGISTRY_PASSWORD" ]; then
        docker push $DOCKER_IMAGE
      fi
    - mkdir -p reports
    - docker inspect --format='{{index .Id}}' $DOCKER_IMAGE > reports/image_digest.txt
    - apk add --no-cache python3
    - python3 scripts/evidence_ledger.py --stage package --job package:container_build --status SUCCESS --artifacts reports/image_digest.txt
  artifacts:
    expire_in: 30 days
    paths:
      - reports/image_digest.txt
      - reports/stage_ledger.json
      - reports/stage_ledger_*.json

# -------------------------------------------------------------
# 7. RELEASE STAGE: Google Cloud Run Candidate Revision Deployment
# -------------------------------------------------------------
release:cloudrun_candidate_deploy:
  stage: release
  image: google/cloud-sdk:slim
  dependencies:
    - package:container_build
  script:
    - mkdir -p reports
    - |
      if [ -n "$GCP_PROJECT" ] && [ -n "$GCP_SA_KEY" ]; then
        echo "[+] GCP credentials detected. Authenticating Service Account..."
        if [ -f "$GCP_SA_KEY" ]; then
          gcloud auth activate-service-account --key-file="$GCP_SA_KEY"
        else
          echo "$GCP_SA_KEY" > /tmp/sa_key.json
          gcloud auth activate-service-account --key-file=/tmp/sa_key.json
          rm -f /tmp/sa_key.json
        fi
        gcloud config set project "$GCP_PROJECT"
        
        echo "[+] Deploying candidate revision to Cloud Run with --no-traffic --tag candidate..."
        gcloud run deploy "$SERVICE_NAME" \
          --image "$DOCKER_IMAGE" \
          --region "$GCP_REGION" \
          --platform managed \
          --no-traffic \
          --tag candidate
        
        CANDIDATE_URL=$(gcloud run services describe "$SERVICE_NAME" --region "$GCP_REGION" --format="value(status.traffic[?tag=='candidate'].url)")
        REVISION_NAME=$(gcloud run services describe "$SERVICE_NAME" --region "$GCP_REGION" --format="value(status.traffic[?tag=='candidate'].revisionName)")
        
        echo "CANDIDATE_URL=${CANDIDATE_URL:-https://faultforge-checkout-136942862703.us-central1.run.app}" >> deploy.env
        
        pip install --no-cache-dir requests
        python3 scripts/cloudrun_traffic.py --action verify --url "$CANDIDATE_URL" --expected-revision "$REVISION_NAME"
        python3 scripts/evidence_ledger.py --stage release --job release:cloudrun_candidate_deploy --status SUCCESS --artifacts reports/release.json
      else
        echo "[!] GCP_PROJECT or GCP_SA_KEY not configured. Skipping live Cloud Run candidate staging deployment."
        python3 -c "import json, time; json.dump({'provider': 'cloudrun', 'status': 'SKIPPED_NO_GCP_CREDENTIALS', 'reason': 'GCP_PROJECT or GCP_SA_KEY not configured in CI/CD variables', 'timestamp': time.time()}, open('reports/release.json', 'w'), indent=2)"
        echo "CANDIDATE_URL=https://faultforge-checkout-136942862703.us-central1.run.app" >> deploy.env
        python3 scripts/evidence_ledger.py --stage release --job release:cloudrun_candidate_deploy --status SKIPPED --artifacts reports/release.json
      fi
  environment:
    name: staging
    url: $CANDIDATE_URL
  artifacts:
    expire_in: 30 days
    reports:
      dotenv: deploy.env
    paths:
      - reports/release.json
      - reports/stage_ledger.json
      - reports/stage_ledger_*.json

# -------------------------------------------------------------
# 8. MONITOR STAGE: Pre & Post Fault Telemetry & Health Probes
# -------------------------------------------------------------
monitor:telemetry_probes:
  stage: monitor
  image: python:3.12-slim
  dependencies:
    - release:cloudrun_candidate_deploy
    - verify:exact_fault_replay_proof
  script:
    - pip install -r requirements.txt
    - python -m uvicorn app.main:app --host 127.0.0.1 --port 8090 &
    - sleep 2
    - python scripts/monitor_service.py
    - python scripts/evidence_ledger.py --stage monitor --job monitor:telemetry_probes --status SUCCESS --artifacts reports/monitor.json
  artifacts:
    expire_in: 30 days
    paths:
      - reports/monitor.json
      - reports/stage_ledger.json
      - reports/stage_ledger_*.json

# -------------------------------------------------------------
# 9. GOVERN STAGE: Supervised Autonomy Gate & Audit Receipt
# -------------------------------------------------------------
govern:audit_receipt_and_gate:
  stage: govern
  image: python:3.12-slim
  dependencies:
    - plan:incident_tracking
    - create:duo_remediation_mr
    - configure:chaos_topology
    - verify:exact_fault_replay_proof
    - secure:sast_and_secret_scan
    - package:container_build
    - release:cloudrun_candidate_deploy
    - monitor:telemetry_probes
  script:
    - apt-get update -qq && apt-get install -y -qq git
    - pip install -r requirements.txt
    - python scripts/classify_risk.py
    - python scripts/generate_receipt.py
    - python scripts/evidence_ledger.py --stage govern --job govern:audit_receipt_and_gate --status SUCCESS --artifacts reports/evidence_receipt.json --approval-required
    - python scripts/evidence_ledger.py --summary
    - python scripts/check_readme_claims.py
    - python scripts/truth_audit.py --final-audit
  artifacts:
    name: "audit-receipt-$CI_COMMIT_SHA"
    expire_in: 30 days
    paths:
      - reports/evidence_receipt.json
      - reports/EVIDENCE_RECEIPT.md
      - reports/risk_classification.json
      - reports/stage_ledger.json
      - reports/stage_ledger_*.json

# Supervised Human Approval Gate for Live Production Promotion
govern:promote_to_production:
  stage: govern
  image: google/cloud-sdk:slim
  needs:
    - job: govern:audit_receipt_and_gate
      artifacts: true
  script:
    - |
      if [ -n "$GCP_PROJECT" ] && [ -n "$GCP_SA_KEY" ]; then
        echo "[+] GCP credentials detected. Authenticating Service Account..."
        if [ -f "$GCP_SA_KEY" ]; then
          gcloud auth activate-service-account --key-file="$GCP_SA_KEY"
        else
          echo "$GCP_SA_KEY" > /tmp/sa_key.json
          gcloud auth activate-service-account --key-file=/tmp/sa_key.json
          rm -f /tmp/sa_key.json
        fi
        gcloud config set project "$GCP_PROJECT"
        echo "[+] Routing 100% production traffic to candidate revision..."
        gcloud run services update-traffic "$SERVICE_NAME" --region "$GCP_REGION" --to-tags candidate=100
      else
        echo "[!] GCP credentials missing. Performing dry-run promotion validation."
        python3 scripts/cloudrun_traffic.py --action route --service "$SERVICE_NAME" --revisions "$SERVICE_NAME-${CI_COMMIT_SHORT_SHA:-staging}=100" --dry-run
      fi
  when: manual
  allow_failure: false
  environment:
    name: production
    url: https://faultforge-checkout-136942862703.us-central1.run.app
