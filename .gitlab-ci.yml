# SPDX-License-Identifier: MIT
# FaultForge GitLab CI/CD Pipeline
# Complete 9 Lifecycle Stages: plan, create, configure, verify, secure, package, release, monitor, govern
# Verified against GitLab Transcend 2026 specification

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - plan
  - create
  - configure
  - verify
  - secure
  - package
  - release
  - monitor
  - govern

secret_detection:
  stage: secure
  allow_failure: false

sast:
  stage: secure

semgrep-sast:
  stage: secure
  allow_failure: false


variables:
  GIT_DEPTH: 0
  PYTHON_VERSION: "3.12"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  SERVICE_NAME: "faultforge-checkout"
  GCP_REGION: "us-central1"
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  PRODUCTION_URL: "https://faultforge-checkout-136942862703.us-central1.run.app"
  FF_FLOW_RUN_URL: "https://gitlab.com/gitlab-ai-hackathon/transcend-october-2026/43424456/showcase/-/automate/agent-sessions/9909079"

cache:
  paths:
    - .cache/pip
    - venv/

# -------------------------------------------------------------
# 1. PLAN STAGE: Incident Work Item Creation & Tracking
# -------------------------------------------------------------
plan:incident_tracking:
  stage: plan
  image: python:3.12-slim
  script:
    - pip install -r requirements.txt
    - python scripts/plan_incident.py
    - python scripts/evidence_ledger.py --stage plan --job plan:incident_tracking --status SUCCESS --artifacts reports/issue.json
  artifacts:
    name: "incident-plan-$CI_COMMIT_SHA"
    expire_in: 30 days
    paths:
      - reports/issue.json
      - reports/stage_ledger.json
      - reports/stage_ledger_*.json

# -------------------------------------------------------------
# 2. CREATE STAGE: Duo Remediation & Branch/MR Synthesis
# -------------------------------------------------------------
create:duo_remediation_mr:
  stage: create
  image: python:3.12-slim
  dependencies:
    - plan:incident_tracking
  script:
    - apt-get update -qq && apt-get install -y -qq git
    - pip install -r requirements.txt
    - git fetch origin --tags
    - git checkout baseline-v0.1.0 -- app/
    - python scripts/start_toxiproxy.py
    - python -m uvicorn stub.mock_shipping_api:app --host 127.0.0.1 --port 8081 &
    - python -m uvicorn app.main:app --host 127.0.0.1 --port 8090 &
    - sleep 2
    - python scripts/run_fault.py --label baseline --iterations 5 --expect-fail --output reports/fault_run_baseline.json
    - git checkout HEAD -- app/
    - python scripts/collect_evidence.py
    - python scripts/diagnose_and_bisect.py
    - python scripts/trigger_duo_flow.py
    - python scripts/record_duo_evidence.py --from-ci-env
    - |
      if [ -f reports/duo_run.json ] && python -c "import json; d=json.load(open('reports/duo_run.json')); exit(0 if d.get('executed') else 1)"; then
        echo "[+] Duo flow executed successfully; recording SUCCESS in evidence ledger."
        python scripts/evidence_ledger.py --stage create --job create:duo_remediation_mr --status SUCCESS --artifacts reports/fault_run_baseline.json reports/incident_dossier.json reports/diagnosis_report.json reports/duo_run.json reports/duo_evidence.json --duo-executed
      else
        echo "[!] Duo flow not executed; recording PARTIAL in evidence ledger."
        python scripts/evidence_ledger.py --stage create --job create:duo_remediation_mr --status PARTIAL --artifacts reports/fault_run_baseline.json reports/incident_dossier.json reports/diagnosis_report.json reports/duo_run.json reports/duo_evidence.json --notes "Duo flow not executed (no credentials or unconfigured)"
      fi
  artifacts:
    name: "remediation-mr-$CI_COMMIT_SHA"
    expire_in: 30 days
    paths:
      - reports/fault_run_baseline.json
      - reports/incident_dossier.json
      - reports/diagnosis_report.json
      - reports/duo_run.json
      - reports/duo_evidence.json
      - reports/stage_ledger.json
      - reports/stage_ledger_*.json

# -------------------------------------------------------------
# 3. CONFIGURE STAGE: Toxiproxy Setup & Chaos Network Wiring
# -------------------------------------------------------------
configure:chaos_topology:
  stage: configure
  image: python:3.12-slim
  variables:
    TOXIPROXY_UPSTREAM: "127.0.0.1:8081"
  dependencies:
    - create:duo_remediation_mr
  script:
    - pip install -r requirements.txt
    - python scripts/start_toxiproxy.py
    - python scripts/configure_chaos.py
    - python scripts/evidence_ledger.py --stage configure --job configure:chaos_topology --status SUCCESS --artifacts reports/fault_config.json
  artifacts:
    expire_in: 30 days
    paths:
      - reports/fault_config.json
      - reports/stage_ledger.json
      - reports/stage_ledger_*.json

# -------------------------------------------------------------
# 4. VERIFY STAGE: Unit, Integration & Exact-Fault Replay Verification
# -------------------------------------------------------------
verify:unit_and_integration:
  stage: verify
  image: python:3.12-slim
  script:
    - pip install -r requirements.txt
    - pytest tests/unit tests/integration tests/test_*.py -v --junitxml=reports/junit_tests.xml --cov=app --cov-report=xml:reports/coverage.xml --cov-report=term
  artifacts:
    expire_in: 30 days
    reports:
      junit: reports/junit_tests.xml
      coverage_report:
        coverage_format: cobertura
        path: reports/coverage.xml

verify:exact_fault_replay_proof:
  stage: verify
  image: python:3.12-slim
  variables:
    GIT_DEPTH: "0"
    SHIPPING_SERVICE_URL: "http://127.0.0.1:8082"
  dependencies:
    - create:duo_remediation_mr
    - configure:chaos_topology
  script:
    - apt-get update -qq && apt-get install -y -qq git
    - pip install -r requirements.txt
    - python scripts/start_toxiproxy.py
    - |
      mkdir -p reports
      REPLAY_TREE_SHA=$(git rev-parse HEAD:app)
      echo "$REPLAY_TREE_SHA" > reports/replay_tree_sha.txt
      echo "[+] Replay app/ tree SHA: $REPLAY_TREE_SHA"

      if [ -f reports/duo_evidence.json ] && python -c "import json; d=json.load(open('reports/duo_evidence.json')); cs=str(d.get('candidate_source', '')).lower(); exit(0 if (cs.startswith('duo-authored') or 'commit authored by the duo service account' in cs) and d.get('source_branch') else 1)"; then
        CANDIDATE_SRC=$(python -c "import json; print(json.load(open('reports/duo_evidence.json'))['candidate_source'])")
        echo "[+] Evaluating candidate commit with merged Duo resilience fix: $CI_COMMIT_SHA ($CANDIDATE_SRC)"
        FIX_SHA=$CI_COMMIT_SHA
      else
        echo "[!] No Duo-authored MR branch detected; falling back to reference-fix"
        git fetch origin reference-fix
        git checkout origin/reference-fix -- app/
        FIX_SHA=$(git rev-parse origin/reference-fix || git rev-parse reference-fix)
        CANDIDATE_SRC="reference-fix (not Duo-authored)"
        git rev-parse HEAD:app > reports/replay_tree_sha.txt
      fi
    - python -m uvicorn stub.mock_shipping_api:app --host 127.0.0.1 --port 8081 &
    - python -m uvicorn app.main:app --host 127.0.0.1 --port 8090 &
    - sleep 3
    - python scripts/run_fault.py --label candidate --git-sha $FIX_SHA --iterations 10 --output reports/fault_run_hardened.json
    - python scripts/evaluate_replay.py --baseline reports/fault_run_baseline.json --candidate reports/fault_run_hardened.json --output reports/replay_evaluation.json --candidate-source "$CANDIDATE_SRC"
    - python scripts/evidence_ledger.py --stage verify --job verify:exact_fault_replay_proof --status SUCCESS --artifacts reports/fault_run_hardened.json reports/replay_evaluation.json reports/replay_tree_sha.txt
  artifacts:
    name: "chaos-replay-evidence-$CI_COMMIT_SHA"
    expire_in: 30 days
    paths:
      - reports/fault_run_baseline.json
      - reports/fault_run_hardened.json
      - reports/replay_evaluation.json
      - reports/replay_tree_sha.txt
      - reports/duo_evidence.json
      - reports/stage_ledger.json
      - reports/stage_ledger_*.json

# -------------------------------------------------------------
# 5. SECURE STAGE: Static Analysis & Secret Detection
# -------------------------------------------------------------
secure:sast_and_secret_scan:
  stage: secure
  image: python:3.12-slim
  dependencies:
    - verify:exact_fault_replay_proof
  script:
    - pip install -r requirements.txt
    - bandit -r app/ -ll -f json -o reports/bandit_security_report.json
    - python scripts/evidence_ledger.py --stage secure --job secure:sast_and_secret_scan --status SUCCESS --artifacts reports/bandit_security_report.json
  artifacts:
    expire_in: 30 days
    paths:
      - reports/bandit_security_report.json
      - reports/stage_ledger.json
      - reports/stage_ledger_*.json

secure:gitleaks:
  stage: secure
  image:
    name: zricethezav/gitleaks:v8.21.2
    entrypoint: [""]
  dependencies: []
  script:
    - mkdir -p reports
    - gitleaks detect --source=. --config=.gitleaks.toml --redact --no-git --report-format=json --report-path=reports/gitleaks-report.json --exit-code 1
  artifacts:
    expire_in: 30 days
    paths:
      - reports/gitleaks-report.json

# -------------------------------------------------------------
# 6. PACKAGE STAGE: Multi-Stage Container Build & Registry Push
# -------------------------------------------------------------
package:container_build:
  stage: package
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  dependencies:
    - verify:exact_fault_replay_proof
    - secure:sast_and_secret_scan
  script:
    - apk add --no-cache git python3
    - mkdir -p reports
    - DEPLOYED_TREE_SHA=$(git rev-parse HEAD:app)
    - echo "$DEPLOYED_TREE_SHA" > reports/deployed_tree_sha.txt
    - echo "[+] Deployed app/ tree SHA: $DEPLOYED_TREE_SHA"
    - |
      if [ -n "$CI_REGISTRY_USER" ] && [ -n "$CI_REGISTRY_PASSWORD" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        docker build -t $DOCKER_IMAGE .
        docker push $DOCKER_IMAGE
        DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $DOCKER_IMAGE)
      else
        docker build -t $DOCKER_IMAGE .
        DIGEST=$(docker inspect --format='{{index .Id}}' $DOCKER_IMAGE)
      fi
      echo "$DIGEST" > reports/image_digest.txt

      if [ -n "$GCP_PROJECT" ] && [ -n "$GCP_SA_KEY" ]; then
        echo "[+] Pushing container image to Google Artifact Registry..."
        TARGET_REGION="${GCP_REGION:-us-central1}"
        if [ -f "$GCP_SA_KEY" ]; then
          cat "$GCP_SA_KEY" | docker login -u _json_key --password-stdin "https://${TARGET_REGION}-docker.pkg.dev"
        else
          echo "$GCP_SA_KEY" | docker login -u _json_key --password-stdin "https://${TARGET_REGION}-docker.pkg.dev"
        fi
        GCP_IMAGE="${TARGET_REGION}-docker.pkg.dev/${GCP_PROJECT}/faultforge/${SERVICE_NAME}:${CI_COMMIT_SHA}"
        docker tag "$DOCKER_IMAGE" "$GCP_IMAGE"
        docker push "$GCP_IMAGE"
        echo "[+] Successfully pushed $GCP_IMAGE to Artifact Registry."
      fi
    - python3 scripts/verify_tree_parity.py --fail-on-mismatch
    - python3 scripts/evidence_ledger.py --stage package --job package:container_build --status SUCCESS --artifacts reports/image_digest.txt reports/deployed_tree_sha.txt
  artifacts:
    expire_in: 30 days
    paths:
      - reports/image_digest.txt
      - reports/deployed_tree_sha.txt
      - reports/stage_ledger.json
      - reports/stage_ledger_*.json

pages:
  stage: package
  image: alpine:latest
  script:
    - mkdir -p public
    - cp app/dashboard.html public/index.html
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# -------------------------------------------------------------
# 7. RELEASE STAGE: Google Cloud Run Candidate Revision Deployment
# -------------------------------------------------------------
release:cloudrun_candidate_deploy:
  stage: release
  image: google/cloud-sdk:slim
  dependencies:
    - package:container_build
    - verify:exact_fault_replay_proof
  script:
    - mkdir -p reports
    - apt-get update -qq && apt-get install -y -qq python3 git
    - python3 scripts/verify_tree_parity.py --fail-on-mismatch
    - |
      if [ -n "$GCP_PROJECT" ] && [ -n "$GCP_SA_KEY" ]; then
        echo "[+] GCP credentials detected. Authenticating Service Account..."
        if [ -f "$GCP_SA_KEY" ]; then
          gcloud auth activate-service-account --key-file="$GCP_SA_KEY"
        else
          echo "$GCP_SA_KEY" > /tmp/sa_key.json
          gcloud auth activate-service-account --key-file=/tmp/sa_key.json
          rm -f /tmp/sa_key.json
        fi
        gcloud config set project "$GCP_PROJECT"
        
        GCP_IMAGE="${GCP_REGION:-us-central1}-docker.pkg.dev/${GCP_PROJECT}/faultforge/${SERVICE_NAME}:${CI_COMMIT_SHA}"
        echo "[+] Deploying candidate revision to Cloud Run from $GCP_IMAGE with --no-traffic --tag candidate..."
        gcloud run deploy "$SERVICE_NAME" \
          --image "$GCP_IMAGE" \
          --region "$GCP_REGION" \
          --platform managed \
          --no-traffic \
          --tag candidate \
          --set-env-vars ENVIRONMENT=staging
        
        gcloud run services describe "$SERVICE_NAME" --region "$GCP_REGION" --format=json > /tmp/svc_desc.json
        CANDIDATE_URL=$(python3 -c "import json; d=json.load(open('/tmp/svc_desc.json')).get('status',{}); t=d.get('traffic',[]); print(next((x.get('url','') for x in t if x.get('tag')=='candidate'), ''))")
        REVISION_NAME=$(python3 -c "import json; d=json.load(open('/tmp/svc_desc.json')).get('status',{}); t=d.get('traffic',[]); print(next((x.get('revisionName','') for x in t if x.get('tag')=='candidate'), d.get('latestReadyRevisionName', d.get('latestCreatedRevisionName',''))))")
        
        if [ -z "$CANDIDATE_URL" ] && [ -n "$REVISION_NAME" ]; then
          BASE_URL=$(python3 -c "import json; print(json.load(open('/tmp/svc_desc.json')).get('status',{}).get('url',''))")
          if [ -n "$BASE_URL" ]; then
            CANDIDATE_URL=$(echo "$BASE_URL" | sed 's|https://|https://candidate---|')
          fi
        fi

        if [ -z "$CANDIDATE_URL" ] || [ -z "$REVISION_NAME" ]; then
          echo "[-] Error: CANDIDATE_URL or REVISION_NAME is empty after gcloud run services describe. Failing deploy."
          cat /tmp/svc_desc.json
          exit 1
        fi
        
        STABLE_REVISION=$(python3 -c "import json; t=json.load(open('/tmp/svc_desc.json')).get('status',{}).get('traffic',[]); non_cand=[x for x in t if x.get('tag')!='candidate']; print(max(non_cand, key=lambda x: x.get('percent',0)).get('revisionName','') if non_cand else '')")
        if [ -z "$STABLE_REVISION" ]; then
          STABLE_REVISION=$(python3 -c "import json; print(json.load(open('/tmp/svc_desc.json')).get('status',{}).get('latestReadyRevisionName',''))")
        fi
        echo "[+] Primary stable production revision: $STABLE_REVISION"
        echo "[+] Setting clean canary traffic split: $STABLE_REVISION=90, candidate ($REVISION_NAME)=10..."
        gcloud run services update-traffic "$SERVICE_NAME" \
          --region "$GCP_REGION" \
          --to-revisions="$STABLE_REVISION=90,$REVISION_NAME=10" \
          --set-tags="candidate=$REVISION_NAME"
        
        echo "CANDIDATE_URL=$CANDIDATE_URL" >> deploy.env
        echo "STAGING_ENV_NAME=staging" >> deploy.env
        
        apt-get update -qq && apt-get install -y -qq python3
        
        PRODUCTION_SERVICE_URL=$(gcloud run services describe "$SERVICE_NAME" --region "$GCP_REGION" --format="value(status.url)")
        python3 scripts/verify_live.py --url "$PRODUCTION_SERVICE_URL" --service "$SERVICE_NAME" --region "$GCP_REGION" --output reports/live_verification.json
        
        python3 scripts/cloudrun_traffic.py --action verify --url "$CANDIDATE_URL" --expected-revision "$REVISION_NAME"
        python3 -c "import json, time; json.dump({'provider': 'cloudrun', 'status': 'STAGED', 'url': '$CANDIDATE_URL', 'revision': '$REVISION_NAME', 'timestamp': time.time()}, open('reports/release.json', 'w'), indent=2)"
        python3 scripts/evidence_ledger.py --stage release --job release:cloudrun_candidate_deploy --status SUCCESS --artifacts reports/release.json reports/live_verification.json
      else
        echo "[!] GCP_PROJECT or GCP_SA_KEY not set as CI variables. Stopping Cloud Run candidate deployment."
        python3 -c "import json, time; json.dump({'provider': 'cloudrun', 'status': 'SKIPPED_NO_GCP_CREDENTIALS', 'reason': 'GCP_PROJECT or GCP_SA_KEY not configured in CI/CD variables', 'timestamp': time.time()}, open('reports/release.json', 'w'), indent=2)"
        echo "CANDIDATE_URL=https://example.invalid/skipped" >> deploy.env
        echo "STAGING_ENV_NAME=staging (skipped, no GCP credentials)" >> deploy.env
        python3 scripts/evidence_ledger.py --stage release --job release:cloudrun_candidate_deploy --status SKIPPED --artifacts reports/release.json
      fi
  environment:
    name: staging
    url: $CANDIDATE_URL
  artifacts:
    expire_in: 30 days
    reports:
      dotenv: deploy.env
    paths:
      - reports/release.json
      - reports/live_verification.json
      - reports/stage_ledger.json
      - reports/stage_ledger_*.json

# -------------------------------------------------------------
# 8. MONITOR STAGE: Pre & Post Fault Telemetry & Health Probes
# -------------------------------------------------------------
monitor:telemetry_probes:
  stage: monitor
  image: python:3.12-slim
  dependencies:
    - release:cloudrun_candidate_deploy
    - verify:exact_fault_replay_proof
  script:
    - pip install -r requirements.txt
    - python -m uvicorn app.main:app --host 127.0.0.1 --port 8090 &
    - sleep 2
    - python scripts/monitor_service.py
    - python scripts/evidence_ledger.py --stage monitor --job monitor:telemetry_probes --status SUCCESS --artifacts reports/monitor.json
  artifacts:
    expire_in: 30 days
    paths:
      - reports/monitor.json
      - reports/stage_ledger.json
      - reports/stage_ledger_*.json

# -------------------------------------------------------------
# 9. GOVERN STAGE: Supervised Autonomy Gate & Audit Receipt
# -------------------------------------------------------------
govern:audit_receipt_and_gate:
  stage: govern
  image: python:3.12-slim
  dependencies:
    - plan:incident_tracking
    - create:duo_remediation_mr
    - configure:chaos_topology
    - verify:exact_fault_replay_proof
    - secure:sast_and_secret_scan
    - package:container_build
    - release:cloudrun_candidate_deploy
    - monitor:telemetry_probes
  script:
    - apt-get update -qq && apt-get install -y -qq git
    - pip install -r requirements.txt
    - python scripts/verify_tree_parity.py --fail-on-mismatch
    - python scripts/classify_risk.py
    - python scripts/generate_receipt.py
    - python scripts/evidence_ledger.py --stage govern --job govern:audit_receipt_and_gate --status SUCCESS --artifacts reports/evidence_receipt.json --approval-required
    - python scripts/evidence_ledger.py --summary
    - python scripts/check_readme_claims.py
    - python scripts/truth_audit.py --final-audit
  artifacts:
    name: "audit-receipt-$CI_COMMIT_SHA"
    expire_in: 30 days
    paths:
      - reports/evidence_receipt.json
      - reports/EVIDENCE_RECEIPT.md
      - reports/risk_classification.json
      - reports/stage_ledger.json
      - reports/stage_ledger_*.json

# Supervised Human Approval Gate for Live Production Promotion
govern:promote_to_production:
  stage: govern
  image: google/cloud-sdk:slim
  needs:
    - job: govern:audit_receipt_and_gate
      artifacts: true
  script:
    - |
      if [ -n "$GCP_PROJECT" ] && [ -n "$GCP_SA_KEY" ]; then
        echo "[+] GCP credentials detected. Authenticating Service Account..."
        if [ -f "$GCP_SA_KEY" ]; then
          gcloud auth activate-service-account --key-file="$GCP_SA_KEY"
        else
          echo "$GCP_SA_KEY" > /tmp/sa_key.json
          gcloud auth activate-service-account --key-file=/tmp/sa_key.json
          rm -f /tmp/sa_key.json
        fi
        gcloud config set project "$GCP_PROJECT"
        echo "[+] Routing 100% production traffic to candidate revision..."
        gcloud run services update-traffic "$SERVICE_NAME" --region "$GCP_REGION" --to-tags candidate=100
        apt-get update -qq && apt-get install -y -qq python3
        
        PRODUCTION_SERVICE_URL=$(gcloud run services describe "$SERVICE_NAME" --region "$GCP_REGION" --format="value(status.url)")
        python3 scripts/verify_live.py --url "$PRODUCTION_SERVICE_URL" --service "$SERVICE_NAME" --region "$GCP_REGION" --output reports/live_verification_promoted.json
        
        python3 scripts/evidence_ledger.py --stage govern --job govern:promote_to_production --status SUCCESS --artifacts reports/live_verification_promoted.json
      else
        echo "[!] GCP_PROJECT or GCP_SA_KEY not set as CI variables. Stopping production promotion."
        apt-get update -qq && apt-get install -y -qq python3
        python3 scripts/evidence_ledger.py --stage govern --job govern:promote_to_production --status SKIPPED
      fi
  when: manual
  allow_failure: false
  environment:
    name: production
    url: $PRODUCTION_URL
  artifacts:
    expire_in: 30 days
    paths:
      - reports/live_verification_promoted.json
      - reports/stage_ledger.json
      - reports/stage_ledger_*.json

# Official GitLab Native Release Creation
release:official_gitlab_release:
  stage: govern
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0
  needs:
    - job: govern:audit_receipt_and_gate
      artifacts: true
    - job: package:container_build
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $REQUIRE_GITLAB_RELEASE == "true"
  script:
    - echo "[+] Creating verified native GitLab Release for $CI_COMMIT_SHA..."
  release:
    name: "FaultForge Verified Resilience Release $CI_COMMIT_SHA"
    description: |
      ## FaultForge Supervised Resilience Release
      - **Pipeline:** $CI_PIPELINE_ID
      - **Commit SHA:** $CI_COMMIT_SHA
      - **Docker Image:** $DOCKER_IMAGE
      - **Governance:** Verified by Supervised Autonomy Gate & Evidence Ledger
    tag_name: "release-$CI_COMMIT_SHORT_SHA"
    ref: "$CI_COMMIT_SHA"
    assets:
      links:
        - name: "Evidence Receipt (JSON)"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_SHA/raw/reports/evidence_receipt.json?job=govern:audit_receipt_and_gate"
          link_type: "other"
        - name: "Container Image Digest"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_SHA/raw/reports/image_digest.txt?job=package:container_build"
          link_type: "other"
